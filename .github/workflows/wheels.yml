# Distributions: the pure-Python package (wheel and sdist) and abi3 wheels of
# the compiled kernel (one per platform, for every Python >= 3.10), uploaded
# as workflow artifacts. Runs on version tags, on demand, and when the kernel
# or the packaging changes. A v* tag also uploads them to PyPI (job publish).
name: Wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "kernel/**"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Upload the built distributions to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: cocotbext-sva (wheel, sdist)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build --outdir dist
      - name: Check that the wheel installs and imports
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -c "import cocotbext.sva as s; print(s.__name__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-cocotbext-sva
          path: dist/*

  kernel-linux:
    name: kernel (Linux ${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: kernel
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-kernel-linux-${{ matrix.target }}
          path: kernel/dist/*.whl

  kernel-windows:
    name: kernel (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: kernel
          target: x86_64-pc-windows-msvc
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-kernel-windows-x64
          path: kernel/dist/*.whl

  kernel-macos:
    name: kernel (macOS ${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: kernel
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-kernel-macos-${{ matrix.target }}
          path: kernel/dist/*.whl

  kernel-sdist:
    name: kernel (sdist)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: kernel
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-kernel-sdist
          path: kernel/dist/*.tar.gz

  # The built kernel wheel must pass the kernel tests on its platform.
  kernel-test:
    name: kernel wheel test (${{ matrix.os }})
    needs: [kernel-linux, kernel-windows, kernel-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: dist-kernel-linux-x86_64
          - os: windows-latest
            artifact: dist-kernel-windows-x64
          - os: macos-latest
            artifact: dist-kernel-macos-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"       # abi3: the oldest supported Python
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wheels
      - name: Install and test
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-index --find-links wheels cocotbext-sva-kernel
          COCOTBEXT_SVA_KERNEL=native python -m pytest -q tests/test_kernel.py tests/test_offline.py

  # Upload to PyPI (on a v* tag) or TestPyPI (run by hand with testpypi=true)
  # by trusted publishing: no token is stored; PyPI trusts this workflow,
  # file and environment for the two projects (see docs/release.md).
  publish:
    name: publish
    needs: [package, kernel-sdist, kernel-test]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.testpypi)
    runs-on: ubuntu-24.04
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check versions against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in pyproject.toml kernel/pyproject.toml; do
            v=$(python3 -c "import tomllib,sys; print(tomllib.load(open(sys.argv[1],'rb'))['project']['version'])" "$f")
            [ "$v" = "$tag" ] || { echo "$f has version $v, tag is $tag"; exit 1; }
          done
          ls -l dist
      - name: Upload to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Upload to TestPyPI
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
