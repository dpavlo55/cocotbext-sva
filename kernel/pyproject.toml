[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "cocotbext-sva-kernel"
version = "0.1.0"
description = "Optional compiled evaluation kernel and FST reader for cocotbext-sva (used automatically when installed)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Pavlović" }]
requires-python = ">=3.10"
classifiers = [
    "Framework :: cocotb",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Repository = "https://github.com/dpavlo55/cocotbext-sva"
Issues = "https://github.com/dpavlo55/cocotbext-sva/issues"

[tool.maturin]
module-name = "cocotbext_sva_kernel"
features = ["pyo3/extension-module"]
