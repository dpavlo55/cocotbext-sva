<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t">
  <title id="t">When values are sampled within the time step of a clock edge</title>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #2d2a4a; }
    .lbl { font-size: 14px; font-weight: 600; }
    .t2 { font-size: 12px; fill: #6b6880; }
    .code { font-family: Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .wave { fill: none; stroke: #2d2a4a; stroke-width: 2; stroke-linejoin: round; }
    .clk { fill: none; stroke: #2bb3a3; stroke-width: 2; stroke-linejoin: round; }
    .axis { stroke: #b9b2ec; stroke-width: 2; }
  </style>
  <defs>
    <marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/>
    </marker>
    <marker id="hp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7c6fd6"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="328" rx="14" fill="#fafaff" stroke="#e4e0fa"/>

  <!-- the time step of the edge -->
  <rect x="210" y="26" width="380" height="170" rx="10" fill="#f3efff"/>
  <text x="400" y="46" text-anchor="middle" class="t2">one time step: the simulation time of the clock edge</text>

  <!-- clk -->
  <text x="24" y="86" class="lbl">clk</text>
  <path class="clk" d="M80 92 H320 V68 H720"/>

  <!-- a flip-flop output -->
  <text x="24" y="136" class="lbl">q</text>
  <path class="wave" d="M80 124 H436 L444 144 H720"/>
  <path class="wave" d="M80 144 H436 L444 124 H720"/>
  <text x="200" y="139" text-anchor="middle" class="code">old value</text>
  <text x="600" y="139" text-anchor="middle" class="code">new value</text>
  <text x="140" y="114" text-anchor="middle" font-size="12px" font-weight="600" style="fill:#16a34a">✓ what SVA samples</text>

  <!-- axis with the moments -->
  <path d="M80 176 H720" class="axis"/>
  <circle cx="226" cy="176" r="5" fill="#16a34a"/>
  <circle cx="330" cy="176" r="5" fill="#7c6fd6"/>
  <circle cx="440" cy="176" r="5" fill="#2d2a4a"/>
  <text x="226" y="166" text-anchor="middle" class="t2">start</text>
  <text x="330" y="166" text-anchor="middle" class="t2">edge seen</text>
  <text x="440" y="166" text-anchor="middle" class="t2">flip-flops update</text>

  <!-- the two ways of reading -->
  <path d="M226 252 V186" stroke="#16a34a" stroke-width="2" marker-end="url(#hg)"/>
  <text x="24" y="270" class="lbl" style="fill:#16a34a">sampling="preponed"</text>
  <text x="24" y="288" class="t2">a snapshot at the start of the time step:</text>
  <text x="24" y="304" class="t2">always the old value, whatever drives the clock</text>

  <path d="M330 252 V186" stroke="#7c6fd6" stroke-width="2" marker-end="url(#hp)"/>
  <text x="372" y="270" class="lbl" style="fill:#7c6fd6">sampling="edge"</text>
  <text x="372" y="288" class="t2">read when the edge is seen: still the old value when cocotb</text>
  <text x="372" y="304" class="t2">drives the clock, but maybe the new one if the HDL makes it</text>

</svg>
