<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img">
<title>When values are sampled within the time step of a clock edge</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3e4c59"/></marker>
</defs>
<rect x="0" y="0" width="860" height="340" fill="#ffffff"/>
<rect x="230" y="20" width="390" height="180" rx="8" fill="#f5f7fa" stroke="#52606d" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="425" y="42" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#52606d">one time step: the simulation time of the clock edge</text>
<text x="30" y="86" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933">clk</text>
<path d="M 100 92 L 340 92 L 340 68 L 820 68" fill="none" stroke="#3e4c59" stroke-width="1.6"/>
<text x="30" y="138" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933">q</text>
<path d="M 100 124 L 446 124 L 454 144 L 820 144" fill="none" stroke="#1f2933" stroke-width="1.4"/>
<path d="M 100 144 L 446 144 L 454 124 L 820 124" fill="none" stroke="#1f2933" stroke-width="1.4"/>
<text x="165" y="138" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933">old value</text>
<text x="690" y="138" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933">new value</text>
<rect x="100" y="98" width="130" height="18" rx="3" fill="#cfe6da" stroke="#cfe6da" stroke-width="1"/>
<text x="165" y="111" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2933">what SVA samples</text>
<path d="M 100 178 L 820 178" fill="none" stroke="#9aa5b1" stroke-width="1.2"/>
<circle cx="246" cy="178" r="4" fill="#3e4c59"/>
<text x="246" y="168" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">start</text>
<circle cx="340" cy="178" r="4" fill="#3e4c59"/>
<text x="340" y="168" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">edge seen</text>
<circle cx="450" cy="178" r="4" fill="#3e4c59"/>
<text x="450" y="168" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">flip-flops update</text>
<rect x="40" y="256" width="370" height="66" rx="4" fill="#cfe6da" stroke="#3e4c59" stroke-width="1.2"/>
<text x="225.0" y="279.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">sampling="preponed"</text>
<text x="225.0" y="293.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">a snapshot at the start of the time step:</text>
<text x="225.0" y="307.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">always the old value, whatever drives the clock</text>
<path d="M 246 256 L 246 186" fill="none" stroke="#3e4c59" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="450" y="256" width="370" height="66" rx="4" fill="#c9d6e8" stroke="#3e4c59" stroke-width="1.2"/>
<text x="635.0" y="279.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">sampling="edge"</text>
<text x="635.0" y="293.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">read when the edge is seen: the old value when cocotb</text>
<text x="635.0" y="307.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">drives the clock, maybe the new one if the HDL does</text>
<path d="M 520 256 L 520 228 L 340 228 L 340 186" fill="none" stroke="#3e4c59" stroke-width="1.3" marker-end="url(#arrow)"/>
</svg>
