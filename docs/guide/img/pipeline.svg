<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img">
<title>From SVA text to a check at every clock tick</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3e4c59"/></marker>
</defs>
<rect x="0" y="0" width="860" height="360" fill="#ffffff"/>
<rect x="20" y="20" width="820" height="140" rx="8" fill="#f5f7fa" stroke="#52606d" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="36" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#52606d">Once, when the assertion is created</text>
<rect x="20" y="190" width="820" height="150" rx="8" fill="#f7f5ee" stroke="#52606d" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="36" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#52606d">At every clock tick</text>
<rect x="40" y="62" width="150" height="66" rx="4" fill="#e4e7eb" stroke="#3e4c59" stroke-width="1.2"/>
<text x="115.0" y="92.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">Your property</text>
<text x="115.0" y="106.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1f2933">req |-&gt; ##[1:3] ack</text>
<rect x="220" y="62" width="130" height="66" rx="4" fill="#c9d6e8" stroke="#3e4c59" stroke-width="1.2"/>
<text x="285.0" y="92.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">Parser</text>
<text x="285.0" y="106.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">checks the syntax</text>
<rect x="380" y="62" width="130" height="66" rx="4" fill="#c9d6e8" stroke="#3e4c59" stroke-width="1.2"/>
<text x="445.0" y="92.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">Syntax tree</text>
<text x="445.0" y="106.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">names resolved</text>
<rect x="540" y="62" width="130" height="66" rx="4" fill="#c9d6e8" stroke="#3e4c59" stroke-width="1.2"/>
<text x="605.0" y="92.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">Compiler</text>
<text x="605.0" y="106.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">builds the machine</text>
<rect x="700" y="62" width="120" height="66" rx="4" fill="#cfe6da" stroke="#3e4c59" stroke-width="1.2"/>
<text x="760.0" y="85.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">Automaton</text>
<text x="760.0" y="99.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">+ generated Python</text>
<text x="760.0" y="113.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">for the conditions</text>
<path d="M 190 95.0 L 220 95.0" fill="none" stroke="#3e4c59" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 350 95.0 L 380 95.0" fill="none" stroke="#3e4c59" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 510 95.0 L 540 95.0" fill="none" stroke="#3e4c59" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 670 95.0 L 700 95.0" fill="none" stroke="#3e4c59" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="40" y="232" width="220" height="66" rx="4" fill="#c9d6e8" stroke="#3e4c59" stroke-width="1.2"/>
<text x="150.0" y="255.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">Sampler</text>
<text x="150.0" y="269.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">reads the signals the</text>
<text x="150.0" y="283.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">assertions need right now</text>
<rect x="320" y="232" width="220" height="66" rx="4" fill="#cfe6da" stroke="#3e4c59" stroke-width="1.2"/>
<text x="430.0" y="255.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">Engine</text>
<text x="430.0" y="269.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">one step of the automaton:</text>
<text x="430.0" y="283.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">a table lookup, usually</text>
<rect x="600" y="232" width="220" height="66" rx="4" fill="#c9d6e8" stroke="#3e4c59" stroke-width="1.2"/>
<text x="710.0" y="255.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">Reporter</text>
<text x="710.0" y="269.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">logs failures as they happen,</text>
<text x="710.0" y="283.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">counts passes and cover hits</text>
<path d="M 260 265.0 L 320 265.0" fill="none" stroke="#3e4c59" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="290" y="257.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">values</text>
<path d="M 540 265.0 L 600 265.0" fill="none" stroke="#3e4c59" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="570" y="257.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">events</text>
<path d="M 760 128 L 760 176 L 430 176 L 430 232" fill="none" stroke="#3e4c59" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="595" y="170" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">the engine steps this machine</text>
<text x="150" y="320" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">clock edge · start of time step · Probe · dump</text>
<text x="430" y="320" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">never talks to the simulator</text>
</svg>
