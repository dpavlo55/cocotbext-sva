<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" role="img">
<title>Attempts at the same position are merged into one state; transitions are cached</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3e4c59"/></marker>
</defs>
<rect x="0" y="0" width="860" height="450" fill="#ffffff"/>
<text x="20" y="30" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933">Tick 4 of req |-&gt; ##[1:3] ack, after req = 1 at ticks 1, 2 and 3</text>
<rect x="20" y="48" width="120" height="46" rx="4" fill="#c9d6e8" stroke="#3e4c59" stroke-width="1.2"/>
<text x="80.0" y="68.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">waited 1 tick</text>
<text x="80.0" y="82.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">position 1</text>
<circle cx="80" cy="116" r="7" fill="#3e4c59"/>
<text x="80" y="140" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">from tick 3</text>
<rect x="150" y="48" width="120" height="46" rx="4" fill="#c9d6e8" stroke="#3e4c59" stroke-width="1.2"/>
<text x="210.0" y="68.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">waited 2 ticks</text>
<text x="210.0" y="82.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">position 2</text>
<circle cx="210" cy="116" r="7" fill="#3e4c59"/>
<text x="210" y="140" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">from tick 2</text>
<rect x="280" y="48" width="120" height="46" rx="4" fill="#c9d6e8" stroke="#3e4c59" stroke-width="1.2"/>
<text x="340.0" y="68.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">waited 3 ticks</text>
<text x="340.0" y="82.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">position 3, last chance</text>
<circle cx="340" cy="116" r="7" fill="#3e4c59"/>
<text x="340" y="140" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">from tick 1</text>
<path d="M 410 71 L 466 71" fill="none" stroke="#3e4c59" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="438" y="63" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">merge</text>
<rect x="476" y="44" width="364" height="104" rx="4" fill="#cfe6da" stroke="#3e4c59" stroke-width="1.2"/>
<text x="658" y="71.7" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">One state for all of them</text>
<text x="658" y="90.7" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">{1, 2, 3}</text>
<text x="658" y="109.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">plus the oldest start time and the count,</text>
<text x="658" y="128.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">for the failure report</text>
<text x="20" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933">The table the engine fills in as it goes</text>
<rect x="20" y="202" width="820" height="28" rx="0" fill="#e4e7eb" stroke="#3e4c59" stroke-width="1.2"/>
<text x="32" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933">state now</text>
<text x="190" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933">inputs at this tick</text>
<text x="400" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933">next state</text>
<text x="540" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2933">events</text>
<rect x="20" y="230" width="820" height="28" rx="0" fill="#ffffff" stroke="#e4e7eb" stroke-width="1"/>
<text x="32" y="248" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">{ }</text>
<text x="190" y="248" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">req=0</text>
<text x="400" y="248" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">{ }</text>
<text x="540" y="248" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">vacuous success</text>
<rect x="20" y="258" width="820" height="28" rx="0" fill="#f5f7fa" stroke="#e4e7eb" stroke-width="1"/>
<text x="32" y="276" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">{ }</text>
<text x="190" y="276" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">req=1</text>
<text x="400" y="276" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">{1}</text>
<text x="540" y="276" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">a new attempt starts</text>
<rect x="20" y="286" width="820" height="28" rx="0" fill="#ffffff" stroke="#e4e7eb" stroke-width="1"/>
<text x="32" y="304" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">{1}</text>
<text x="190" y="304" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">req=0  ack=0</text>
<text x="400" y="304" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">{2}</text>
<text x="540" y="304" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">still waiting</text>
<rect x="20" y="314" width="820" height="28" rx="0" fill="#f5f7fa" stroke="#e4e7eb" stroke-width="1"/>
<rect x="528" y="318" width="300" height="20" rx="3" fill="#cfe6da" stroke="#cfe6da" stroke-width="1"/>
<text x="32" y="332" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">{1}</text>
<text x="190" y="332" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">req=1  ack=1</text>
<text x="400" y="332" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">{1}</text>
<text x="540" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">1 pass, and a new attempt</text>
<rect x="20" y="342" width="820" height="28" rx="0" fill="#ffffff" stroke="#e4e7eb" stroke-width="1"/>
<rect x="528" y="346" width="300" height="20" rx="3" fill="#f6cdbf" stroke="#f6cdbf" stroke-width="1"/>
<text x="32" y="360" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">{1, 2, 3}</text>
<text x="190" y="360" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">req=0  ack=0</text>
<text x="400" y="360" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">{2, 3}</text>
<text x="540" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">1 failure (the attempt from tick 1)</text>
<rect x="20" y="370" width="820" height="28" rx="0" fill="#f5f7fa" stroke="#e4e7eb" stroke-width="1"/>
<rect x="528" y="374" width="300" height="20" rx="3" fill="#cfe6da" stroke="#cfe6da" stroke-width="1"/>
<text x="32" y="388" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">{1, 2, 3}</text>
<text x="190" y="388" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">req=0  ack=1</text>
<text x="400" y="388" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">{ }</text>
<text x="540" y="388" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">3 passes</text>
<text x="20" y="418" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#52606d">A row is worked out the first time its (state, inputs) pair happens; after that, it is a single lookup.</text>
</svg>
