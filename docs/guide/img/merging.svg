<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t">
  <title id="t">Attempts at the same position are merged into one state; transitions are cached</title>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #2d2a4a; }
    .h { font-size: 14px; font-weight: 700; fill: #7c6fd6; }
    .t1 { font-size: 13px; font-weight: 600; }
    .t2 { font-size: 12px; fill: #6b6880; }
    .code { font-family: Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #2d2a4a; }
    .box { fill: #ffffff; stroke: #b9b2ec; stroke-width: 1.5; }
    .hot { fill: #f3efff; stroke: #7c6fd6; stroke-width: 2; }
    .arrow { stroke: #7c6fd6; stroke-width: 2; fill: none; marker-end: url(#head); }
    .row { fill: #ffffff; }
    .alt { fill: #f6f4ff; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7c6fd6"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="428" rx="14" fill="#fafaff" stroke="#e4e0fa"/>

  <!-- attempts at their positions -->
  <text x="24" y="32" class="h">Tick 4 of req |-&gt; ##[1:3] ack, after req = 1 at ticks 1, 2 and 3</text>
  <rect x="24" y="48" width="104" height="44" rx="8" class="box"/>
  <text x="76" y="68" text-anchor="middle" class="t1">waited 1 tick</text>
  <text x="76" y="84" text-anchor="middle" class="t2">position 1</text>
  <rect x="142" y="48" width="104" height="44" rx="8" class="box"/>
  <text x="194" y="68" text-anchor="middle" class="t1">waited 2 ticks</text>
  <text x="194" y="84" text-anchor="middle" class="t2">position 2</text>
  <rect x="260" y="48" width="104" height="44" rx="8" class="box"/>
  <text x="312" y="68" text-anchor="middle" class="t1">waited 3 ticks</text>
  <text x="312" y="84" text-anchor="middle" class="t2">position 3 (last chance)</text>

  <circle cx="76" cy="112" r="9" fill="#7c6fd6"/>
  <text x="76" y="138" text-anchor="middle" class="t2">from tick 3</text>
  <circle cx="194" cy="112" r="9" fill="#7c6fd6"/>
  <text x="194" y="138" text-anchor="middle" class="t2">from tick 2</text>
  <circle cx="312" cy="112" r="9" fill="#7c6fd6"/>
  <text x="312" y="138" text-anchor="middle" class="t2">from tick 1</text>

  <path d="M380 92 H430" class="arrow"/>
  <text x="405" y="82" text-anchor="middle" class="t2">merge</text>

  <rect x="440" y="48" width="296" height="96" rx="10" class="hot"/>
  <text x="588" y="74" text-anchor="middle" class="t1">One state for all of them:</text>
  <text x="588" y="98" text-anchor="middle" class="code">{1, 2, 3}</text>
  <text x="588" y="120" text-anchor="middle" class="t2">plus the oldest start time and the count,</text>
  <text x="588" y="135" text-anchor="middle" class="t2">for the failure report</text>

  <!-- the cached table -->
  <text x="24" y="182" class="h">The table the engine fills in as it goes</text>
  <rect x="24" y="194" width="712" height="28" fill="#e9e5fc"/>
  <g class="t1">
    <text x="36" y="213">state now</text><text x="176" y="213">inputs at this tick</text>
    <text x="376" y="213">next state</text><text x="506" y="213">events</text>
  </g>
  <rect x="24" y="222" width="712" height="28" class="row"/>
  <rect x="24" y="250" width="712" height="28" class="alt"/>
  <rect x="24" y="278" width="712" height="28" class="row"/>
  <rect x="24" y="306" width="712" height="28" class="alt"/>
  <rect x="24" y="334" width="712" height="28" class="row"/>
  <rect x="24" y="362" width="712" height="28" class="alt"/>

  <g class="code">
    <text x="36" y="241">{ }</text>       <text x="176" y="241">req=0</text>              <text x="376" y="241">{ }</text>
    <text x="36" y="269">{ }</text>       <text x="176" y="269">req=1</text>              <text x="376" y="269">{1}</text>
    <text x="36" y="297">{1}</text>       <text x="176" y="297">req=0  ack=0</text>       <text x="376" y="297">{2}</text>
    <text x="36" y="325">{1}</text>       <text x="176" y="325">req=1  ack=1</text>       <text x="376" y="325">{1}</text>
    <text x="36" y="353">{1, 2, 3}</text> <text x="176" y="353">req=0  ack=0</text>       <text x="376" y="353">{2, 3}</text>
    <text x="36" y="381">{1, 2, 3}</text> <text x="176" y="381">req=0  ack=1</text>       <text x="376" y="381">{ }</text>
  </g>
  <g font-size="12.5px">
    <text x="506" y="241" style="fill:#6b6880">vacuous success</text>
    <text x="506" y="269" style="fill:#6b6880">a new attempt starts</text>
    <text x="506" y="297" style="fill:#6b6880">still waiting</text>
    <text x="506" y="325" style="fill:#16a34a">1 pass, and a new attempt</text>
    <text x="506" y="353" style="fill:#dc2626">1 failure (from tick 1)</text>
    <text x="506" y="381" style="fill:#16a34a">3 passes</text>
  </g>

  <text x="24" y="414" class="t2">A row is worked out the first time its (state, inputs) pair happens; after that, it is a single lookup.</text>
</svg>
