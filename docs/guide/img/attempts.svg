<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t">
  <title id="t">Attempts of req |-> ##[1:3] ack, one per clock tick</title>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #2d2a4a; }
    .lbl { font-size: 14px; font-weight: 600; }
    .tick { font-size: 12px; fill: #6b6880; }
    .note { font-size: 12px; fill: #6b6880; }
    .grid { stroke: #e4e0fa; stroke-width: 1; stroke-dasharray: 3 4; }
    .wave { fill: none; stroke: #2d2a4a; stroke-width: 2; stroke-linejoin: round; }
    .clk { fill: none; stroke: #2bb3a3; stroke-width: 2; stroke-linejoin: round; }
    .pass { fill: #22c55e; }
    .fail { fill: #ef4444; }
    .win { fill: #7c6fd6; opacity: 0.12; }
  </style>
  <rect x="1" y="1" width="758" height="358" rx="14" fill="#fafaff" stroke="#e4e0fa"/>

  <!-- tick grid: tick k at x = 120 + 60k -->
  <g class="grid">
    <path d="M120 40 V300"/><path d="M180 40 V300"/><path d="M240 40 V300"/><path d="M300 40 V300"/>
    <path d="M360 40 V300"/><path d="M420 40 V300"/><path d="M480 40 V300"/><path d="M540 40 V300"/>
    <path d="M600 40 V300"/><path d="M660 40 V300"/>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="120" y="32">0</text><text x="180" y="32">1</text><text x="240" y="32">2</text><text x="300" y="32">3</text>
    <text x="360" y="32">4</text><text x="420" y="32">5</text><text x="480" y="32">6</text><text x="540" y="32">7</text>
    <text x="600" y="32">8</text><text x="660" y="32">9</text>
  </g>
  <text x="20" y="32" class="tick">clock tick</text>

  <!-- clk: rising edge at every tick -->
  <text x="20" y="72" class="lbl">clk</text>
  <path class="clk" d="M90 78 H120 V58 H150 V78 H180 V58 H210 V78 H240 V58 H270 V78 H300 V58 H330 V78 H360 V58 H390 V78 H420 V58 H450 V78 H480 V58 H510 V78 H540 V58 H570 V78 H600 V58 H630 V78 H660 V58 H690 V78 H710"/>

  <!-- req: 1 at ticks 1 and 5 -->
  <text x="20" y="126" class="lbl">req</text>
  <path class="wave" d="M90 132 H150 V112 H210 V132 H390 V112 H450 V132 H710"/>

  <!-- ack: 1 at tick 3 only -->
  <text x="20" y="174" class="lbl">ack</text>
  <path class="wave" d="M90 180 H270 V160 H330 V180 H710"/>

  <!-- attempts -->
  <text x="20" y="214" class="lbl">attempts</text>

  <!-- attempt started at tick 1: window ticks 2..4, ack at 3 -->
  <rect x="210" y="222" width="180" height="22" rx="4" class="win"/>
  <rect x="176" y="229" width="128" height="8" rx="4" class="pass"/>
  <circle cx="180" cy="233" r="6" class="pass"/>
  <circle cx="300" cy="233" r="6" class="pass"/>
  <text x="314" y="238" font-size="13" font-weight="600" style="fill:#16a34a">✓ passes at tick 3</text>

  <!-- attempt started at tick 5: window ticks 6..8, no ack -->
  <rect x="450" y="256" width="180" height="22" rx="4" class="win"/>
  <rect x="416" y="263" width="188" height="8" rx="4" class="fail"/>
  <circle cx="420" cy="267" r="6" class="fail"/>
  <circle cx="600" cy="267" r="6" class="fail"/>
  <text x="614" y="272" font-size="13" font-weight="600" style="fill:#dc2626">✗ fails at tick 8</text>

  <!-- every other tick: a vacuous attempt -->
  <g fill="#b9b2ec">
    <circle cx="120" cy="292" r="5"/><circle cx="240" cy="292" r="5"/><circle cx="300" cy="292" r="5"/>
    <circle cx="360" cy="292" r="5"/><circle cx="480" cy="292" r="5"/><circle cx="540" cy="292" r="5"/>
    <circle cx="600" cy="292" r="5"/><circle cx="660" cy="292" r="5"/>
  </g>

  <!-- legend -->
  <rect x="20" y="318" width="22" height="12" rx="3" class="win"/>
  <text x="48" y="329" class="note">window ##[1:3]: ack must come 1 to 3 ticks after req</text>
  <circle cx="440" cy="324" r="5" fill="#b9b2ec"/>
  <text x="452" y="329" class="note">vacuous attempt: req was 0, nothing to check</text>
</svg>
