[build-system]
requires = ["setuptools>=77"]   # (SPDX license expression, PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "cocotbext-sva"
version = "0.1.0.dev0"
description = "SystemVerilog-style immediate and concurrent assertions for cocotb"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Pavlović" }]
requires-python = ">=3.10"
dependencies = ["cocotb>=2.0,<3"]
classifiers = [
    "Framework :: cocotb",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Repository = "https://github.com/dpavlo55/cocotbext-sva"
Issues = "https://github.com/dpavlo55/cocotbext-sva/issues"

[project.optional-dependencies]
fast = ["cocotbext-sva-kernel"]      # optional compiled kernel (kernel/)

[tool.setuptools.packages.find]
where = ["src"]
include = ["cocotbext.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
