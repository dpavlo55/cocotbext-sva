[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cocotbext-sva"
version = "0.1.0.dev0"
description = "SystemVerilog-style immediate and concurrent assertions for cocotb"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = ["cocotb>=2.0,<3"]

[project.optional-dependencies]
fast = ["cocotbext-sva-kernel"]      # optional compiled kernel (kernel/)
classifiers = [
    "Framework :: cocotb",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cocotbext.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
