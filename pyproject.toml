[build-system]
requires = ["setuptools>=77"]   # (SPDX license expression, PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "cocotbext-sva"
version = "0.1.0"
description = "SystemVerilog-style immediate and concurrent assertions for cocotb"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Pavlović" }]
requires-python = ">=3.10"
dependencies = ["cocotb>=2.0,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: cocotb",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Documentation = "https://cocotbext-sva.readthedocs.io"
Repository = "https://github.com/dpavlo55/cocotbext-sva"
Issues = "https://github.com/dpavlo55/cocotbext-sva/issues"

[project.optional-dependencies]
fast = ["cocotbext-sva-kernel"]      # optional compiled kernel (kernel/)

[tool.setuptools.packages.find]
where = ["src"]
include = ["cocotbext.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
